# Forward the trusted outer TLS proxy's scheme, falling back to this connection.
# Keep the published port on loopback unless the outer proxy is on a private network.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
    http http;
}

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 'healthy\n';
    }

    location /images/ {
        alias /srv/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    # /static/ is served by WhiteNoise from the web image.
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }
}
